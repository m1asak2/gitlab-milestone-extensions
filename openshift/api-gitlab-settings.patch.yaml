# Apply to the existing api Deployment using: oc patch deployment api --patch-file openshift/api-gitlab-settings.patch.yaml
# Create gitlab-reader separately from a secure file; never commit its values.
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: GitLab__BaseUrl
              valueFrom:
                secretKeyRef:
                  name: gitlab-reader
                  key: base-url
            - name: GitLab__PrivateToken
              valueFrom:
                secretKeyRef:
                  name: gitlab-reader
                  key: private-token
