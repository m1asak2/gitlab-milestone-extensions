services:
  api:
    build:
      context: ../..
      dockerfile: docker/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      GitLab__BaseUrl: ${GITLAB_BASE_URL:?Set GITLAB_BASE_URL}
      GitLab__PrivateToken: ${GITLAB_PRIVATE_TOKEN:?Set GITLAB_PRIVATE_TOKEN}
    extra_hosts:
      - "gitlab.local:host-gateway"
    expose:
      - "8080"

  web:
    build:
      context: ../..
      dockerfile: docker/web/Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8080}:8080"
