name: Validate Gantt PR
on:
  push:
    branches: [feature/issue-gantt-chart]
  pull_request:
    branches: [main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore gitlab-milestone-extensions.slnx
      - name: Build
        run: dotnet build gitlab-milestone-extensions.slnx --no-restore --configuration Release
      - name: Test
        run: dotnet test gitlab-milestone-extensions.slnx --no-build --configuration Release
